name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Build & Test
    runs-on: macos-14
    env:
      SCHEME: Shoo
      PROJECT: Shoo.xcodeproj
      # Pin lint version so a SwiftLint release adding/tightening a rule can't turn a green
      # build red without a source change.
      SWIFTLINT_VERSION: '0.57.0'
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Cache Homebrew downloads
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-${{ runner.os }}-xcodegen-xcbeautify

      - name: Install tools
        run: |
          brew install xcodegen xcbeautify
          # Pinned SwiftLint from the official portable release (brew only offers latest).
          curl -sSL -o /tmp/swiftlint.zip \
            "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip"
          unzip -o /tmp/swiftlint.zip -d /tmp/swiftlint >/dev/null
          sudo install /tmp/swiftlint/swiftlint /usr/local/bin/swiftlint
          echo "xcodegen: $(xcodegen --version)"
          echo "swiftlint: $(swiftlint version)"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Check XcodeGen drift (advisory)
        run: |
          # The committed .xcodeproj should match project.yml. This is advisory because
          # XcodeGen output can differ purely by tool version; CI regenerates before building
          # anyway, so drift never affects the actual build/test.
          if ! git diff --quiet -- Shoo.xcodeproj; then
            echo "::warning::Shoo.xcodeproj differs from a fresh 'xcodegen generate'. If you changed project.yml, run xcodegen and commit; otherwise it's likely a tool-version difference."
            git diff --stat -- Shoo.xcodeproj
          fi

      - name: SwiftLint
        run: swiftlint lint --strict --reporter github-actions-logging

      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | xcbeautify

      - name: Test with coverage
        run: |
          set -o pipefail
          rm -rf TestResults.xcresult
          xcodebuild \
            -project "$PROJECT" -scheme "$SCHEME" \
            -destination 'platform=macOS' \
            -configuration Debug \
            -enableCodeCoverage YES \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            test | xcbeautify

      - name: Report coverage
        run: bash scripts/coverage.sh TestResults.xcresult

      - name: Upload result bundle
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: TestResults
          path: TestResults.xcresult
          retention-days: 7
