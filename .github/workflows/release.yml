name: Release

# Manual-only until plan 05 wires real signing + App Store upload. Until then this produces
# an unsigned archive that can't be submitted, so we don't want a version tag to auto-fire a
# dead-end "release". Re-enable `push: tags: ['v*.*.*']` once signing secrets are in place.
on:
  workflow_dispatch:

jobs:
  archive:
    name: Archive (unsigned until plan 05)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.2'

      - name: Install tools
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Plan 05 fills in signing (App Store Connect API key / match) and swaps
      # this for `bundle exec fastlane release`. Until then we only produce an
      # unsigned archive to prove the path end-to-end.
      - name: Build unsigned archive
        run: |
          set -o pipefail
          xcodebuild \
            -project Shoo.xcodeproj -scheme Shoo \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/Shoo.xcarchive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            archive

      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: Shoo-unsigned-archive
          path: build/Shoo.xcarchive
          retention-days: 14
