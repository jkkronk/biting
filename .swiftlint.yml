# SwiftLint configuration for Shoo.
# Optional tool — install with `brew install swiftlint`. The build does not require it.

included:
  - Shoo
  - ShooTests

excluded:
  - build
  - DerivedData

disabled_rules:
  - todo            # scaffold intentionally ships with TODO markers

opt_in_rules:
  - empty_count
  - closure_spacing
  - explicit_init

line_length:
  warning: 120
  error: 160
  ignores_comments: true

identifier_name:
  # Short names (a, b, d, p, s, t…) are idiomatic in the geometry/detection math
  # and in test fixtures; the 40-char ceiling still guards against the real smell.
  min_length: 1
  excluded:
    - id
    - x
    - y

# Two central coordinator classes (AppState, CameraController) legitimately run long;
# raise the ceilings to give headroom rather than split them under launch pressure.
type_body_length:
  warning: 450
  error: 600
file_length:
  warning: 700
  error: 1200
